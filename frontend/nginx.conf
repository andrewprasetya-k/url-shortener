server {
    listen 80;
    server_name zippr.dev;
    root /usr/share/nginx/html;
    index index.html;

    # --- Real API routes (create-url, my-urls, auth/*, etc.) ---
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Known app pages: served directly as static files, never treated
    # as a short-link code ---
    location ~ ^/(login|register|dashboard)/?$ {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # --- Bare single-segment path that isn't a known app route: treat as a
    # short-link code and send to the backend redirect handler (GET /:url) ---
    location ~ ^/[A-Za-z0-9_-]+$ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Everything else: static assets, root "/", _next/* ---
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}

server {
    listen 443 ssl;
    server_name zippr.dev;
    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare Origin Certificate — only Cloudflare's edge ever sees this,
    # visitors always talk to Cloudflare over its own certificate.
    ssl_certificate /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(login|register|dashboard)/?$ {
        try_files $uri $uri.html $uri/index.html =404;
    }

    location ~ ^/[A-Za-z0-9_-]+$ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
