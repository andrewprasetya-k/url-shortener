server {
    listen 80;
    server_name wiyata.me www.wiyata.me;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: uncomment to reverse-proxy API calls through this same origin
    # instead of calling the backend's own domain directly. Only makes sense
    # if frontend and backend run as containers on the same Docker network
    # (e.g. via docker-compose) — "backend" below would be that service's name.
    #
    # Upside: browser only ever talks to one origin, so CORS_ALLOWED_ORIGINS
    # on the backend doesn't need to include this frontend's domain at all.
    # Downside: couples this nginx to always sitting in front of that specific
    # backend; doesn't help the future Capacitor mobile app, which has its own
    # native origin and will always call the backend's public URL directly.
    #
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
